[project]
name = "krono-terminal"
version = "0.1.0"
description = "Automated cryptocurrency trading platform with paper and live agents"
requires-python = ">=3.12,<3.14"
dependencies = [
  "anthropic>=0.40,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pandas>=2.2,<3",
  "langgraph>=0.6.6,<0.7",
  "langchain-core>=0.3.84,<1",
  "langchain-openai>=0.3.35,<0.4",
  "backtrader>=1.9.78",
  "boto3>=1.40,<2",
  "pyyaml>=6,<7",
  "cryptography>=44,<47",
  "websockets>=13,<16",
]

[project.optional-dependencies]
platform = [
  "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
src = ["."]
line-length = 100
include = ["backend/**/*.py", "scripts/**/*.py", "tests/e2e/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
package = false


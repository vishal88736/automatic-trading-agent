name: Terminal validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: krono_test
          POSTGRES_USER: krono_test
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U krono_test -d krono_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      KRONO_TEST_DATABASE_DSN: postgresql://krono_test:local-ci-only@127.0.0.1:5432/krono_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --frozen --extra platform --python 3.12
      - run: .venv/bin/python -m pytest -q backend/tests/test_platform_postgres.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser to API to PostgreSQL
        run: |
          export KRONO_DATABASE_DSN="$KRONO_TEST_DATABASE_DSN"
          export KRONO_PRODUCT_API_KEY="$(openssl rand -hex 32)"
          export KRONO_E2E_PRODUCT_API_KEY="$KRONO_PRODUCT_API_KEY"
          export KRONO_E2E_PRODUCT_API_URL="http://127.0.0.1:8794"
          .venv/bin/python -m scripts.platform_database
          TERMINAL_TEST_RUN=1 .venv/bin/python -m uvicorn tests.e2e.product_api:application --factory --host 127.0.0.1 --port 8794 &
          product_pid=$!
          trap 'kill "$product_pid" 2>/dev/null || true' EXIT
          curl --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 --output /dev/null "$KRONO_E2E_PRODUCT_API_URL/platform/paper-account"
          npm run test:e2e -- tests/e2e/platform-strategy.spec.ts

      - name: Browser disconnect and process recovery
        run: |
          export KRONO_DATABASE_DSN="$KRONO_TEST_DATABASE_DSN"
          export KRONO_PRODUCT_API_KEY="$(openssl rand -hex 32)"
          export KRONO_E2E_PRODUCT_API_KEY="$KRONO_PRODUCT_API_KEY"
          export KRONO_E2E_PRODUCT_API_URL="http://127.0.0.1:8794"
          export KRONO_E2E_AUTONOMY=1
          export KRONO_E2E_BUILD=1
          npm run test:e2e -- tests/e2e/paper-autonomy.spec.ts

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.python
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      TERMINAL_MODE: SIMULATION
      MARKET_PROVIDER: fixture
      NEWS_PROVIDER: fixture
      RESEARCH_ENABLED: "false"
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Locked Python dependencies
        run: uv sync --frozen --python 3.12
      - name: Locked frontend dependencies
        run: npm ci
      - name: Publication-path and credential-pattern check
        run: .venv/bin/python -m scripts.public_audit
      - name: Backend style and tests
        run: |
          .venv/bin/ruff check backend scripts tests/e2e
          .venv/bin/ruff format --check backend scripts tests/e2e
          .venv/bin/python -m pytest backend/tests tests/inherited/test_regime_detection.py tests/inherited/test_backtest_engine.py tests/inherited/test_portfolio_intelligence.py -q
      - name: Frontend formatting, strict types and production build
        run: |
          node_modules/.bin/prettier --check frontend/src frontend/vite.config.ts frontend/tsconfig.json playwright.config.ts tests/e2e scripts/dev.mjs package.json
          npm run build
      - name: AWS control plane, isolation and infrastructure
        run: |
          npm run check:platform
          npm run build:platform
          npm run test:platform
          cp deploy/aws/.env.example deploy/aws/.env
          npm run aws:synth
      - name: Build deployment containers without AWS credentials
        run: |
          docker build -f deploy/aws/Dockerfile.api -t krono-api:validation .
          docker run --rm --read-only --entrypoint node krono-api:validation -e "try { require.resolve('aws-cdk-lib'); process.exit(1) } catch(e) { if(e.code !== 'MODULE_NOT_FOUND') throw e; console.log('Infrastructure tooling excluded from the API image') }"
          docker build -f deploy/aws/Dockerfile.agent -t krono-agent:validation .
          docker run --rm --read-only -v krono-agent-validation:/app/.runtime --entrypoint python krono-agent:validation -c "from pathlib import Path; from backend.engine import Engine; p=Path('/app/.runtime/check'); p.write_text('ok'); p.unlink(); print('Non-root worker imports and writable runtime volume verified')"
      - name: Install isolated browser
        run: npx playwright install --with-deps chromium
      - name: Chromium product workspace
        run: npm run test:e2e

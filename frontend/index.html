<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f8f5" />
    <script>
      try {
        if (localStorage.getItem("krono-theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
          document.querySelector('meta[name="theme-color"]').content =
            "#060a07";
        }
      } catch {
        // Light is the default when browser storage is unavailable.
      }
    </script>
    <meta
      name="description"
      content="Build and backtest crypto strategies, then run autonomous paper trading agents with virtual funds in Krono."
    />
    <title>Krono · Crypto Trading Workspace</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
